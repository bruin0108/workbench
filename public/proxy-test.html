<!DOCTYPE html>
<html><head><meta charset="UTF-8"></head>
<body style="font-family:monospace;padding:20px">
<h3>Proxy 通道测试</h3>
<p>这个页面和你的工作台在同一个端口 (5174)，用同一条 proxy 通道。</p>
<input id="q" placeholder="hello" autofocus style="font-size:16px;padding:8px;width:300px">
<button onclick="go()" style="font-size:16px;padding:8px">发送</button>
<pre id="out" style="background:#eee;padding:15px;margin-top:10px;min-height:80px"></pre>
<script>
async function go(){
  const q=document.getElementById('q').value||'hello'
  document.getElementById('out').textContent='请求中...'
  try{
    const r=await fetch('/api/ai/'+encodeURIComponent(q)+'?model=openai')
    document.getElementById('out').textContent='状态:'+r.status+'\n内容:'+(await r.text()).substring(0,300)
  }catch(e){
    document.getElementById('out').textContent='错误:'+e.message+'\n请截图发给我'
  }
}
</script>
</body></html>
